<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basement Supply Inventory Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --accent: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4CAF50;
            --warning: #ff9800;
            --danger: #f44336;
            --gray: #6c757d;
            --border: #dee2e6;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        /* Header Styles */
        header {
            grid-column: 1 / -1;
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .local-storage-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--light);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--gray);
            border: 1px solid var(--border);
        }

        /* Inventory Section */
        .inventory-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        h2 {
            color: var(--secondary);
            font-size: 1.6rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            color: var(--dark);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: var(--primary);
        }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .inventory-table th {
            text-align: left;
            padding: 15px;
            background: var(--light);
            color: var(--dark);
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }

        .inventory-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--border);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: var(--gray);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(67, 97, 238, 0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #e9ecef;
            border-color: var(--gray);
        }

        /* Add Item Form */
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        label.required:after {
            content: " *";
            color: var(--danger);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .icon-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .icon-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon-option:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .icon-option.selected {
            border-color: var(--primary);
            background: rgba(67, 97, 238, 0.05);
        }

        .icon-option i {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .btn-success {
            background: var(--success);
            color: white;
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .btn-success:hover {
            background: #3d8b40;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(76, 175, 80, 0.3);
        }

        /* Item Display (when added) */
        .item-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 10px;
            background: white;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            animation: fadeIn 0.5s;
        }

        .item-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(67, 97, 238, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-category {
            font-size: 0.9rem;
            color: var(--gray);
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            color: var(--primary);
            background: rgba(67, 97, 238, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .form-section {
                position: static;
            }
        }

        @media (max-width: 576px) {
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .controls {
                width: 100%;
                flex-direction: column;
            }
            
            select {
                width: 100%;
            }
            
            .icon-selection {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Basement Supply Inventory Tracker</h1>
            <p class="subtitle">Secure shared inventory with team</p>
            <div class="local-storage-badge">
                <i class="fas fa-database"></i>
                <span>Using local storage</span>
            </div>
        </header>

        <main class="inventory-section">
            <div class="section-header">
                <h2>Current Inventory</h2>
                <div class="controls">
                    <select id="categoryFilter">
                        <option>All Categories</option>
                        <option>Kitchen</option>
                        <option>Cleaning</option>
                        <option>Party Supplies</option>
                        <option>Tools</option>
                    </select>
                    <select id="sortBy">
                        <option>Sort by Name</option>
                        <option>Sort by Date Added</option>
                        <option>Sort by Category</option>
                    </select>
                </div>
            </div>

            <div id="inventoryContainer">
                <!-- Empty state shown initially -->
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-box-open"></i>
                    <h3>No Items in Inventory</h3>
                    <p>Add your first item using the form</p>
                </div>

                <!-- Inventory items will appear here -->
                <div id="inventoryItems" style="display: none;"></div>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button class="btn btn-primary" id="exportBtn">
                    <i class="fas fa-file-export"></i> Export
                </button>
            </div>
        </main>

        <aside class="form-section">
            <h2>Add New Item</h2>
            
            <form id="addItemForm">
                <div class="form-group">
                    <label for="itemName" class="required">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Plastic Cups" required>
                </div>

                <div class="form-group">
                    <label>Select Icon</label>
                    <div class="icon-selection" id="iconSelection">
                        <!-- Icons will be added by JavaScript -->
                    </div>
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add Item to Inventory
                </button>
            </form>
        </aside>
    </div>

    <script>
        // Inventory data structure
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let selectedIcon = 'box';

        // Icon options with FontAwesome classes
        const iconOptions = [
            { id: 'mug', name: 'Mug', icon: 'fas fa-mug-hot' },
            { id: 'bowl', name: 'Bowl', icon: 'fas fa-bowl-food' },
            { id: 'plate', name: 'Plate', icon: 'fas fa-plate-wheat' },
            { id: 'box', name: 'Box', icon: 'fas fa-box' },
            { id: 'bag', name: 'Bag', icon: 'fas fa-shopping-bag' },
            { id: 'gloves', name: 'Gloves', icon: 'fas fa-hand-paper' },
            { id: 'tissue', name: 'Tissue', icon: 'fas fa-toilet-paper' },
            { id: 'bottle', name: 'Bottle', icon: 'fas fa-wine-bottle' },
            { id: 'utensils', name: 'Utensils', icon: 'fas fa-utensils' }
        ];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Create icon selection options
            const iconSelection = document.getElementById('iconSelection');
            iconOptions.forEach(icon => {
                const iconOption = document.createElement('div');
                iconOption.className = `icon-option ${icon.id === selectedIcon ? 'selected' : ''}`;
                iconOption.dataset.icon = icon.id;
                iconOption.innerHTML = `
                    <i class="${icon.icon}"></i>
                    <span>${icon.name}</span>
                `;
                iconOption.addEventListener('click', () => selectIcon(icon.id));
                iconSelection.appendChild(iconOption);
            });

            // Load existing inventory
            loadInventory();

            // Form submission
            document.getElementById('addItemForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addItem();
            });

            // Button events
            document.getElementById('refreshBtn').addEventListener('click', loadInventory);
            document.getElementById('exportBtn').addEventListener('click', exportInventory);

            // Filter and sort events
            document.getElementById('categoryFilter').addEventListener('change', loadInventory);
            document.getElementById('sortBy').addEventListener('change', loadInventory);
        });

        // Select an icon
        function selectIcon(iconId) {
            selectedIcon = iconId;
            document.querySelectorAll('.icon-option').forEach(option => {
                option.classList.remove('selected');
                if (option.dataset.icon === iconId) {
                    option.classList.add('selected');
                }
            });
        }

        // Add new item
        function addItem() {
            const itemName = document.getElementById('itemName').value.trim();
            if (!itemName) {
                alert('Please enter an item name');
                return;
            }

            const newItem = {
                id: Date.now(),
                name: itemName,
                icon: selectedIcon,
                category: 'Uncategorized',
                dateAdded: new Date().toISOString().split('T')[0]
            };

            inventory.unshift(newItem);
            saveInventory();
            loadInventory();
            
            // Reset form
            document.getElementById('addItemForm').reset();
            selectIcon('box'); // Reset to default icon
        }

        // Load inventory items
        function loadInventory() {
            const inventoryItems = document.getElementById('inventoryItems');
            const emptyState = document.getElementById('emptyState');
            
            // Apply filters and sorting
            let filteredItems = [...inventory];
            const categoryFilter = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            
            if (categoryFilter !== 'All Categories') {
                filteredItems = filteredItems.filter(item => item.category === categoryFilter);
            }
            
            if (sortBy === 'Sort by Name') {
                filteredItems.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'Sort by Date Added') {
                filteredItems.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
            }
            
            // Display items or empty state
            if (filteredItems.length > 0) {
                emptyState.style.display = 'none';
                inventoryItems.style.display = 'block';
                
                let itemsHTML = '';
                filteredItems.forEach(item => {
                    const iconInfo = iconOptions.find(icon => icon.id === item.icon);
                    itemsHTML += `
                        <div class="item-row" data-id="${item.id}">
                            <div class="item-icon">
                                <i class="${iconInfo.icon}"></i>
                            </div>
                            <div class="item-details">
                                <div class="item-name">${item.name}</div>
                                <div class="item-category">${item.category} • Added ${item.dateAdded}</div>
                            </div>
                            <div class="item-actions">
                                <button class="action-btn" onclick="editItem(${item.id})" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="action-btn" onclick="deleteItem(${item.id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                
                inventoryItems.innerHTML = itemsHTML;
            } else {
                emptyState.style.display = 'block';
                inventoryItems.style.display = 'none';
            }
        }

        // Edit item (placeholder function)
        function editItem(id) {
            const item = inventory.find(item => item.id === id);
            if (item) {
                document.getElementById('itemName').value = item.name;
                selectIcon(item.icon);
                deleteItem(id); // Remove old item (will be re-added when form is submitted)
            }
        }

        // Delete item
        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                inventory = inventory.filter(item => item.id !== id);
                saveInventory();
                loadInventory();
            }
        }

        // Save inventory to local storage
        function saveInventory() {
            localStorage.setItem('inventory', JSON.stringify(inventory));
        }

        // Export inventory
        function exportInventory() {
            if (inventory.length === 0) {
                alert('No items to export');
                return;
            }
            
            const dataStr = JSON.stringify(inventory, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `inventory-${new Date().toISOString().split('T')[0]}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
    </script>
</body>
</html>
