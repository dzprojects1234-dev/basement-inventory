name: Test Secrets

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Test Secret Access
      env:
        URL: ${{ secrets.SUPABASE_URL }}
        KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        echo "Testing secrets..."
        echo "URL length: ${#URL} characters"
        echo "KEY length: ${#KEY} characters"
        
        if [[ -z "$URL" ]]; then
          echo "❌ SUPABASE_URL is empty!"
          exit 1
        fi
        
        if [[ -z "$KEY" ]]; then
          echo "❌ SUPABASE_ANON_KEY is empty!"
          exit 1
        fi
        
        if [[ "$KEY" == eyJ* ]]; then
          echo "✅ SUPABASE_ANON_KEY format looks correct (starts with eyJ)"
        else
          echo "⚠️  SUPABASE_ANON_KEY doesn't start with eyJ - double check!"
        fi
        
        echo "✅ Secrets are set correctly"
